<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sonic Racing - Call Center Championship</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background: #05010a radial-gradient(circle at 50% 10%, #1e0938 0%, #05010a 90%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 0px; /* Reduced to bring board up */
      z-index: 10;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #fff 20%, #00f0ff 60%, #ff0077 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.6));
    }

    p.subtitle {
      color: #e2b6ff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 2px;
      text-shadow: 0 0 8px rgba(226, 182, 255, 0.5);
    }

    /* 3D Scene Setup */
    .scene {
      width: 100%;
      max-width: 1150px;
      perspective: 1000px; /* This creates the 3D depth */
      margin-top: 20px;
      margin-bottom: 40px;
    }

    /* Track Container tilted backwards */
    .track-container {
      background: rgba(18, 10, 36, 0.95);
      border: 3px solid #ff0077;
      border-radius: 16px;
      padding: 30px 20px 40px 20px;
      box-shadow: 0 30px 60px rgba(255, 0, 119, 0.4), inset 0 0 40px rgba(0, 240, 255, 0.2);
      transform: rotateX(45deg); /* Tilts the board */
      transform-style: preserve-3d; /* Allows children to be 3D */
    }

    /* Grid pattern on the floor to enhance 3D effect */
    .track-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      border-radius: 12px;
      pointer-events: none;
    }

    /* Distance Markers */
    .distance-markers {
      display: flex;
      justify-content: space-between;
      margin-left: 155px;
      margin-right: 40px;
      padding-bottom: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: #00f0ff;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(0,240,255,0.8);
      transform: translateZ(1px); /* Keep slightly above board */
    }

    /* Individual Lane */
    .lane {
      display: flex;
      align-items: center;
      height: 85px;
      margin-top: 5px;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Glowing divider lines on the floor */
    .lane::after {
      content: '';
      position: absolute;
      bottom: 0; left: 160px; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,0,119,0.5), transparent);
      box-shadow: 0 0 10px rgba(255,0,119,0.8);
    }

    .team-label {
      width: 150px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      transform: translateZ(10px) rotateX(-45deg); /* Counter-rotate to stand upright */
      transform-origin: bottom center;
      text-shadow: 0 5px 10px rgba(0,0,0,0.8);
    }

    .ring-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7a0 20%, #ffd700 60%, #b8860b 100%);
      border: 2px solid #fff;
      box-shadow: 0 0 15px #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: #3d2400;
    }

    /* Track Asphalt */
    .track {
      flex: 1;
      height: 55px;
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      margin: 0 10px;
      border-radius: 8px;
      border-top: 1px solid rgba(0, 240, 255, 0.3);
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: inset 0 0 15px rgba(0,0,0,1);
      transform-style: preserve-3d;
    }

    /* 3D Finish Line Gate */
    .finish-gate {
      position: absolute;
      right: 0;
      top: -20px;
      bottom: -20px;
      width: 10px;
      background: linear-gradient(180deg, #00f0ff, #ffd700);
      box-shadow: 0 0 20px #00f0ff, 0 0 40px #ff0077;
      transform: rotateY(-90deg) translateZ(5px);
      transform-origin: right center;
    }

    /* Car Positioning Wrapper (Slides left to right) */
    .car-positioner {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: left 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
      z-index: 5;
    }

    /* Car Sprite (Counter-rotates to stand up in 3D) */
    .car-sprite {
      transform: rotateX(-45deg) translateZ(15px); /* Stands up and hovers slightly */
      transform-origin: bottom center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Fake shadow on the 3D floor directly under the car */
    .car-shadow {
      position: absolute;
      width: 70px;
      height: 20px;
      background: rgba(0,0,0,0.8);
      border-radius: 50%;
      top: 15px;
      left: -5px;
      filter: blur(5px);
      transform: translateZ(1px); /* Flat on the floor */
    }

    .car-svg {
      width: 70px;
      height: 35px;
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.5)); /* Adds depth to the standing sprite */
    }

    .car-score-tooltip {
      position: absolute;
      top: -30px;
      background: #ffd700;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
      white-space: nowrap;
    }

    /* Leader Cards Bottom (Kept flat for UI readability) */
    .podium-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1150px;
      z-index: 10;
    }

    .card {
      background: rgba(20, 10, 40, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--team-color);
      box-shadow: 0 0 15px var(--team-color);
    }

    .card .team-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #a0aec0;
      margin-bottom: 6px;
    }

    .card .team-score {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 15px rgba(0,240,255,0.6);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Sonic Team Racing ⚡</h1>
    <p class="subtitle">3D Performance Arena</p>
  </header>

  <div class="scene">
    <div class="track-container">
      <div class="distance-markers">
        <span>START (0%)</span>
        <span>25%</span>
        <span>50%</span>
        <span>75%</span>
        <span>🏁 100%</span>
      </div>
      <div id="lanes-list">Loading race tracks...</div>
    </div>
  </div>

  <div class="podium-cards" id="podium-cards"></div>

  <script>
    const lanesList = document.getElementById('lanes-list');
    const podiumCards = document.getElementById('podium-cards');

    // High-tech Sonic style car SVG
    function getSonicCarSVG(color) {
      return `
        <svg class="car-svg" viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 32 L20 18 L55 12 L90 20 L115 30 L118 36 L5 38 Z" fill="${color}" />
          <path d="M40 18 L70 18 L85 24 L35 24 Z" fill="#00f0ff" opacity="0.9" />
          <path d="M15 32 L110 32" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
          <path d="M2 22 L18 22 L15 28 L0 28 Z" fill="${color}" />
          <rect x="5" y="28" width="4" height="6" fill="#111" />
          <circle cx="30" cy="38" r="10" fill="#111" stroke="#00f0ff" stroke-width="2"/>
          <circle cx="30" cy="38" r="4" fill="#fff" />
          <circle cx="92" cy="38" r="10" fill="#111" stroke="#00f0ff" stroke-width="2"/>
          <circle cx="92" cy="38" r="4" fill="#fff" />
        </svg>
      `;
    }

    async function loadData() {
      try {
        const response = await fetch('data.json?cachebust=' + new Date().getTime());
        const data = await response.json();

        const sortedTeams = [...data.teams].sort((a, b) => b.score - a.score);

        lanesList.innerHTML = '';
        podiumCards.innerHTML = '';

        sortedTeams.forEach((team, index) => {
          const rank = index + 1;
          const score = Math.min(Math.max(team.score, 0), 100);

          // Build 3D Race Lane
          const lane = document.createElement('div');
          lane.className = 'lane';
          lane.innerHTML = `
            <div class="team-label">
              <div class="ring-badge">${rank}</div>
              <span>${team.name}</span>
            </div>
            <div class="track">
              <div class="finish-gate"></div>
              
              <div class="car-positioner" style="left: calc(${score}% - ${score > 88 ? '65px' : '0px'});">
                <div class="car-shadow"></div>
                <div class="car-sprite">
                  <div class="car-score-tooltip">${score}%</div>
                  ${getSonicCarSVG(team.color)}
                </div>
              </div>

            </div>
          `;
          lanesList.appendChild(lane);

          // Build Flat UI Card
          const card = document.createElement('div');
          card.className = 'card';
          card.style.setProperty('--team-color', team.color);
          card.innerHTML = `
            <div class="team-name" style="color:${team.color}">${team.name}</div>
            <div class="team-score">${score}%</div>
          `;
          podiumCards.appendChild(card);
        });

      } catch (error) {
        console.error('Error loading JSON data:', error);
        lanesList.innerHTML = '<p style="color:#ff0077; padding:20px; text-align:center;">Failed to load team performance data.</p>';
      }
    }

    loadData();
  </script>
</body>
</html>
