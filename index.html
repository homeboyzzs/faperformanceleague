<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First American - Performance Championship</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background: #080214 radial-gradient(circle at 50% 20%, #1e0938 0%, #080214 80%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #fff 20%, #00f0ff 60%, #ff0077 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.6));
    }

    p.subtitle {
      color: #e2b6ff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 2px;
      text-shadow: 0 0 8px rgba(226, 182, 255, 0.5);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      max-width: 1150px;
    }

    /* Track Container */
    .track-container {
      background: rgba(18, 10, 36, 0.85);
      border: 2px solid #ff0077;
      border-radius: 16px;
      padding: 25px 20px;
      box-shadow: 0 0 30px rgba(255, 0, 119, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* Distance Markers */
    .distance-markers {
      display: flex;
      justify-content: space-between;
      margin-left: 155px;
      margin-right: 40px;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(0, 240, 255, 0.3);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: #00f0ff;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(0,240,255,0.8);
    }

    /* Individual Lane */
    .lane {
      display: flex;
      align-items: center;
      height: 70px;
      margin-top: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .lane:last-child {
      border-bottom: none;
    }

    .team-label {
      width: 150px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* Golden Ring Rank Badge */
    .ring-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7a0 20%, #ffd700 60%, #b8860b 100%);
      border: 2px solid #fff;
      box-shadow: 0 0 10px #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 900;
      color: #3d2400;
    }

    /* Track Asphalt */
    .track {
      flex: 1;
      height: 48px;
      position: relative;
      background: repeating-linear-gradient(90deg, #120924 0px, #120924 40px, #1c0e38 40px, #1c0e38 80px);
      margin: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Finish Line Ring Gate */
    .finish-gate {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 18px;
      background: linear-gradient(180deg, #00f0ff, #ff0077, #ffd700);
      box-shadow: 0 0 15px #00f0ff, 0 0 25px #ff0077;
      z-index: 1;
    }

    /* Car Wrapper */
    .car-wrapper {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 0%;
      transition: left 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      z-index: 2;
    }

    /* Light Trail Behind Car */
    .car-trail {
      position: absolute;
      right: 45px;
      height: 6px;
      width: 80px;
      border-radius: 3px;
      opacity: 0.8;
      filter: blur(2px);
      pointer-events: none;
    }

    .car-svg {
      width: 58px;
      height: 28px;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
    }

    .car-score-tooltip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffd700;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      box-shadow: 0 0 10px #ffd700;
      white-space: nowrap;
    }

    /* Leader Cards Bottom */
    .podium-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .card {
      background: rgba(20, 10, 40, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--team-color);
      box-shadow: 0 0 10px var(--team-color);
    }

    .card .team-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #a0aec0;
      margin-bottom: 6px;
    }

    .card .team-score {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0,240,255,0.6);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ First American Team Racing ⚡</h1>
    <p class="subtitle">Performance League</p>
  </header>

  <div class="main-container">
    <div class="track-container">
      <div class="distance-markers">
        <span>START (0%)</span>
        <span>25%</span>
        <span>50%</span>
        <span>75%</span>
        <span>⚡ OVERDRIVE (100%)</span>
      </div>
      <div id="lanes-list">Loading race tracks...</div>
    </div>

    <div class="podium-cards" id="podium-cards"></div>
  </div>

  <script>
    const lanesList = document.getElementById('lanes-list');
    const podiumCards = document.getElementById('podium-cards');

    // High-tech Sonic style car SVG
    function getSonicCarSVG(color) {
      return `
        <svg class="car-svg" viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Main Chassis -->
          <path d="M5 32 L20 18 L55 12 L90 20 L115 30 L118 36 L5 38 Z" fill="${color}" />
          <!-- Neon Accents & Windshield -->
          <path d="M40 18 L70 18 L85 24 L35 24 Z" fill="#00f0ff" opacity="0.8" />
          <path d="M15 32 L110 32" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
          <!-- Rear Spoiler -->
          <path d="M2 22 L18 22 L15 28 L0 28 Z" fill="${color}" />
          <rect x="5" y="28" width="4" height="6" fill="#111" />
          <!-- Wheels -->
          <circle cx="30" cy="38" r="9" fill="#111" stroke="#00f0ff" stroke-width="2"/>
          <circle cx="30" cy="38" r="4" fill="#fff" />
          <circle cx="92" cy="38" r="9" fill="#111" stroke="#00f0ff" stroke-width="2"/>
          <circle cx="92" cy="38" r="4" fill="#fff" />
        </svg>
      `;
    }

    async function loadData() {
      try {
        const response = await fetch('data.json?cachebust=' + new Date().getTime());
        const data = await response.json();

        // Sort teams by score (highest rank first)
        const sortedTeams = [...data.teams].sort((a, b) => b.score - a.score);

        lanesList.innerHTML = '';
        podiumCards.innerHTML = '';

        sortedTeams.forEach((team, index) => {
          const rank = index + 1;
          const score = Math.min(Math.max(team.score, 0), 100);

          // Build Race Lane
          const lane = document.createElement('div');
          lane.className = 'lane';
          lane.innerHTML = `
            <div class="team-label">
              <div class="ring-badge">${rank}</div>
              <span>${team.name}</span>
            </div>
            <div class="track">
              <div class="finish-gate"></div>
              <div class="car-wrapper" style="left: calc(${score}% - ${score > 88 ? '55px' : '0px'});">
                <div class="car-trail" style="background: linear-gradient(90deg, transparent, ${team.color});"></div>
                <div class="car-score-tooltip">${score}%</div>
                ${getSonicCarSVG(team.color)}
              </div>
            </div>
          `;
          lanesList.appendChild(lane);

          // Build Quick Stat Card
          const card = document.createElement('div');
          card.className = 'card';
          card.style.setProperty('--team-color', team.color);
          card.innerHTML = `
            <div class="team-name" style="color:${team.color}">${team.name}</div>
            <div class="team-score">${score}%</div>
          `;
          podiumCards.appendChild(card);
        });

      } catch (error) {
        console.error('Error loading JSON data:', error);
        lanesList.innerHTML = '<p style="color:#ff0077; padding:20px; text-align:center;">Failed to load team performance data.</p>';
      }
    }

    loadData();
  </script>
</body>
</html>
