<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split-Screen Call Center Racing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

    :root {
      --bg-color: #05010a;
      --panel-bg: rgba(10, 5, 20, 0.9);
      --ui-border: rgba(0, 240, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Prevent scrolling, act like a game screen */
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      height: 80px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 100;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }

    .title-area h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 20%, #00f0ff 60%, #ff0077 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
    }

    .title-area p {
      color: #e2b6ff;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .minimap-container {
      width: 250px;
      height: 70px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      position: relative;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      padding: 5px;
    }

    .minimap-svg {
      width: 100%;
      height: 100%;
    }

    .map-dot {
      transition: all 1s ease-out;
      filter: drop-shadow(0 0 4px currentColor);
    }

    .split-screen-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      width: 100vw;
      height: 100vh;
      background: #000;
      padding-top: 80px; /* Offset for header */
    }

    .player-screen {
      position: relative;
      background: #080214;
      overflow: hidden;
      border: 2px solid #222;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    /* Team-specific glow borders */
    .player-screen::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 40px var(--team-color);
      opacity: 0.3;
      pointer-events: none;
      z-index: 20;
    }

    .scene-3d {
      position: absolute;
      bottom: -10%;
      width: 100%;
      height: 70%;
      perspective: 400px;
      display: flex;
      justify-content: center;
      z-index: 1;
    }

    .road {
      width: 300%;
      height: 200%;
      position: absolute;
      bottom: 0;
      transform: rotateX(75deg);
      transform-origin: bottom center;
      /* Road texture with grid lines */
      background: 
        linear-gradient(90deg, rgba(255,255,255,0) 48%, rgba(255,255,255,0.8) 49%, rgba(255,255,255,0.8) 51%, rgba(255,255,255,0) 52%), /* Center Line */
        linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(30,10,50,1) 100%);
      background-size: 100px 100px, 100% 100%;
      border-left: 15px solid var(--team-color);
      border-right: 15px solid var(--team-color);
      box-shadow: 0 0 50px var(--team-color);
    }

    /* Horizontal moving lines to create forward speed */
    .road::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(to top, transparent, transparent 40px, rgba(0, 240, 255, 0.2) 42px, rgba(0, 240, 255, 0.2) 44px);
      animation: drive 0.5s linear infinite;
    }

    @keyframes drive {
      from { background-position: 0 0; }
      to { background-position: 0 44px; }
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      padding: 15px;
      pointer-events: none;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .rank-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 2px 2px 0 #000, 0 0 10px #ffd700;
      -webkit-text-stroke: 1px #b8860b;
    }

    .rank-indicator span {
      font-size: 1rem;
      vertical-align: super;
    }

    .stats-panel {
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--team-color);
      padding: 5px 12px;
      border-radius: 4px;
      text-align: right;
      backdrop-filter: blur(4px);
    }

    .team-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--team-color);
      text-shadow: 0 0 5px var(--team-color);
      text-transform: uppercase;
    }

    .score-text {
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
    }

    .kart-wrapper {
      position: absolute;
      bottom: 15px;
      z-index: 5;
      animation: hover 2s ease-in-out infinite alternate;
    }

    @keyframes hover {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(-1deg); }
    }

    .kart-svg {
      width: 140px;
      height: 90px;
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.8));
    }
  </style>
</head>
<body>

  <header class="dashboard-header">
    <div class="title-area">
      <h1>⚡ Grand Prix Dashboard ⚡</h1>
      <p>Live CSAT / Performance Circuit</p>
    </div>
    
    <div class="minimap-container">
      <svg class="minimap-svg" viewBox="0 0 250 70">
        <!-- Circuit Path -->
        <path id="circuit-track" 
              d="M 35 35 L 215 35" 
              fill="none" 
              stroke="rgba(255,255,255,0.2)" 
              stroke-width="15" 
              stroke-linecap="round" />
        <path id="circuit-highlight" 
              d="M 35 35 L 215 35" 
              fill="none" 
              stroke="rgba(0, 240, 255, 0.5)" 
              stroke-width="2" 
              stroke-dasharray="5,5" 
              stroke-linecap="round" />
        
        <!-- Minimap Dots will be injected here via JS -->
        <g id="minimap-dots"></g>
        
        <!-- Start/Finish flags -->
        <text x="15" y="40" fill="#fff" font-size="14">🏁</text>
      </svg>
    </div>
  </header>

  <div class="split-screen-grid" id="split-screen-grid">
    <!-- Player screens will be generated here -->
  </div>

  <script>
    // Fallback data in case data.json doesn't exist yet or fails to load
    const dummyData = {
      "teams": [
        { "name": "Team Delta", "color": "#ffb800", "score": 91 },
        { "name": "Team Alpha", "color": "#ff0055", "score": 82 },
        { "name": "Team Bravo", "color": "#0066ff", "score": 65 },
        { "name": "Team Foxtrot", "color": "#00ff66", "score": 58 },
        { "name": "Team Charlie", "color": "#00f0ff", "score": 45 },
        { "name": "Team Echo", "color": "#b800ff", "score": 30 }
      ]
    };

    const gridContainer = document.getElementById('split-screen-grid');
    const minimapDotsContainer = document.getElementById('minimap-dots');
    
    // Get path details for minimap calculations
    const circuitPath = document.getElementById('circuit-track');
    const pathLength = circuitPath.getTotalLength();

    function getKartSVG(color) {
      return `
        <svg class="kart-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Exhaust Pipes -->
          <rect x="60" y="80" width="15" height="15" fill="#333" rx="3"/>
          <rect x="125" y="80" width="15" height="15" fill="#333" rx="3"/>
          <!-- Exhaust Flames -->
          <path d="M67 95 Q 67 110 60 115 Q 75 110 75 95 Z" fill="#00f0ff" opacity="0.8">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="0.2s" repeatCount="indefinite"/>
          </path>
          <path d="M132 95 Q 132 110 125 115 Q 140 110 140 95 Z" fill="#00f0ff" opacity="0.8">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="0.2s" repeatCount="indefinite"/>
          </path>
          
          <!-- Rear Tires -->
          <rect x="20" y="50" width="35" height="55" fill="#111" rx="8" stroke="#222" stroke-width="2"/>
          <rect x="145" y="50" width="35" height="55" fill="#111" rx="8" stroke="#222" stroke-width="2"/>
          <!-- Tire Treads -->
          <line x1="25" y1="60" x2="50" y2="60" stroke="#000" stroke-width="3"/>
          <line x1="25" y1="75" x2="50" y2="75" stroke="#000" stroke-width="3"/>
          <line x1="25" y1="90" x2="50" y2="90" stroke="#000" stroke-width="3"/>
          <line x1="150" y1="60" x2="175" y2="60" stroke="#000" stroke-width="3"/>
          <line x1="150" y1="75" x2="175" y2="75" stroke="#000" stroke-width="3"/>
          <line x1="150" y1="90" x2="175" y2="90" stroke="#000" stroke-width="3"/>

          <!-- Spoiler -->
          <path d="M35 30 L165 30 L175 40 L25 40 Z" fill="${color}"/>
          <rect x="60" y="40" width="10" height="20" fill="#222"/>
          <rect x="130" y="40" width="10" height="20" fill="#222"/>

          <!-- Main Chassis Body (Rear View) -->
          <path d="M45 55 Q 100 45 155 55 L 165 85 L 35 85 Z" fill="${color}"/>
          
          <!-- Driver Helmet (Simple sphere) -->
          <circle cx="100" cy="40" r="18" fill="#fff" stroke="#ccc" stroke-width="2"/>
          <!-- Helmet Visor -->
          <path d="M85 38 Q 100 45 115 38 L 115 45 Q 100 52 85 45 Z" fill="#111"/>
          
          <!-- Tail Lights -->
          <rect x="50" y="65" width="25" height="8" fill="#ff0000" rx="3" filter="drop-shadow(0 0 5px #ff0000)"/>
          <rect x="125" y="65" width="25" height="8" fill="#ff0000" rx="3" filter="drop-shadow(0 0 5px #ff0000)"/>
        </svg>
      `;
    }

    function getRankSuffix(rank) {
      if (rank === 1) return 'st';
      if (rank === 2) return 'nd';
      if (rank === 3) return 'rd';
      return 'th';
    }

    async function initDashboard() {
      let data = dummyData;

      try {
        // Try fetching actual data.json
        const response = await fetch('data.json?cachebust=' + new Date().getTime());
        if (response.ok) {
          data = await response.json();
        } else {
          console.warn("data.json not found, using dummy data.");
        }
      } catch (error) {
        console.warn("Error fetching data.json, using dummy data.", error);
      }

      // Sort teams to determine ranks
      const sortedTeams = [...data.teams].sort((a, b) => b.score - a.score);
      
      gridContainer.innerHTML = '';
      minimapDotsContainer.innerHTML = '';

      sortedTeams.forEach((team, index) => {
        const rank = index + 1;
        const score = Math.min(Math.max(team.score, 0), 100);
        const rankSuffix = getRankSuffix(rank);

        const screen = document.createElement('div');
        screen.className = 'player-screen';
        screen.style.setProperty('--team-color', team.color);

        // We alter the road animation speed slightly based on rank to make it dynamic
        // 1st place road moves faster
        const animationDuration = 0.3 + (rank * 0.05);

        screen.innerHTML = `
          <div class="hud">
            <div class="hud-top">
              <div class="rank-indicator">${rank}<span>${rankSuffix}</span></div>
              <div class="stats-panel">
                <div class="team-name">${team.name}</div>
                <div class="score-text">CSAT: ${score}%</div>
              </div>
            </div>
          </div>
          
          <div class="scene-3d">
            <div class="road" style="animation-duration: ${animationDuration}s;"></div>
          </div>
          
          <div class="kart-wrapper">
            ${getKartSVG(team.color)}
          </div>
        `;
        gridContainer.appendChild(screen);

        // Calculate position along the horizontal straight line of our minimap
        // The path goes from x=35 to x=215 (total length 180)
        const pathLength = 180;
        const positionX = 35 + (pathLength * (score / 100));
        
        // Add dot to SVG
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", positionX);
        dot.setAttribute("cy", 35);
        dot.setAttribute("r", "5");
        dot.setAttribute("fill", team.color);
        dot.setAttribute("class", "map-dot");
        
        // Add a pulsing halo ring
        const halo = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        halo.setAttribute("cx", positionX);
        halo.setAttribute("cy", 35);
        halo.setAttribute("r", "8");
        halo.setAttribute("fill", "none");
        halo.setAttribute("stroke", team.color);
        halo.setAttribute("stroke-width", "1");
        halo.setAttribute("opacity", "0.5");
        
        minimapDotsContainer.appendChild(halo);
        minimapDotsContainer.appendChild(dot);
      });
    }

    // Initialize on load
    window.onload = initDashboard;
  </script>
</body>
</html>
